{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="{% static 'css/registor.css' %}">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h1>Sign Up</h1>
            <p>create your account</p>
            <form action="{% url 'register' %}" method="POST">
                {% csrf_token %}
                <label for="username">first name</label>
                <input type="text" id="fname" name="fname" placeholder="Enter your first name" required>
                <label for="username">last name</label>
                <input type="text" id="lname" name="lname" placeholder="Enter your last name" required>
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>

                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="pass1" placeholder="Enter your password" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="pass2" placeholder="Confirm password" required>
                
                <button type="submit" class="btn">Continue</button>
            </form>
            <div class="footer">
                <p>I already have an account <a href="{% url 'login'%}">Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
